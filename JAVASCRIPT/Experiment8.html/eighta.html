<!DOCTYPE html>
<html>
<head><title>Larger Number Program</title></head>
<body>
  <script>
    let a = parseInt(prompt("Enter first integer:"));
    let b = parseInt(prompt("Enter second integer:"));
    let c = parseInt(prompt("Enter third integer:"));

    if (a === b && b === c) {
      document.write("<b>EQUAL NUMBERS</b>");
    } else {
      let largest = Math.max(a, b, c);
      document.write("<b>" + largest + " LARGER NUMBER</b>");
    }
  </script>
</body>
</html>

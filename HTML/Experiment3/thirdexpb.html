<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embed Audio and Video Example</title>
  <h1>Embed Audio and Video Example</h1>
</head>
<body>
  <h2>Audio Example</h2>
  <!-- Free sample MP3 (public domain) -->
  <audio controls>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <h2>Video Example</h2>
  <!-- Free sample MP4 video -->
  <video controls width="480">
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
  </video>
</body>
</html>

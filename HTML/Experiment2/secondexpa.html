<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Example</title>
</head>
<body>
    <h2>Student Grades Table</h2>
    <table border="1">
        <tr>
            <th rowspan="2">Name</th>
            <th colspan="2">Subject</th>
        </tr>
        <tr>
            <th>Maths</th>
            <th>Science</th>
        </tr>
        <tr>
            <td>chandrika</td>
            <td>85</td>
            <td>92</td>
        </tr>
        <tr>
            <td>vennela</td>
            <td>78</td>
            <td>88</td>
        </tr>
        <tr>
            <td>deepika</td>
            <td>90</td>
            <td>80</td>
        </tr>
    </table>
</body>
</html>

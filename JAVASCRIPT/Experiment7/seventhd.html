<!DOCTYPE html>
<html>
<head>
    <title>Math Object Demo</title>
</head>
<body>
    <h2>Math Object Properties and Methods Demo</h2>
    <script>
        // Math properties
        document.write("<b>Math.PI:</b> " + Math.PI + "<br>");
        document.write("<b>Math.E:</b> " + Math.E + "<br>");
        document.write("<b>Math.LN2:</b> " + Math.LN2 + "<br>");

        // Math methods
        document.write("<b>Math.sqrt(16):</b> " + Math.sqrt(16) + "<br>");
        document.write("<b>Math.pow(2, 5):</b> " + Math.pow(2, 5) + "<br>");
        document.write("<b>Math.abs(-42):</b> " + Math.abs(-42) + "<br>");
        document.write("<b>Math.round(3.8):</b> " + Math.round(3.8) + "<br>");
        document.write("<b>Math.floor(3.8):</b> " + Math.floor(3.8) + "<br>");
        document.write("<b>Math.ceil(3.2):</b> " + Math.ceil(3.2) + "<br>");
        document.write("<b>Math.max(5, 10, 15):</b> " + Math.max(5, 10, 15) + "<br>");
        document.write("<b>Math.min(5, 10, 15):</b> " + Math.min(5, 10, 15) + "<br>");
        document.write("<b>Math.random() [0,1):</b> " + Math.random() + "<br>");
    </script>
</body>
</html>

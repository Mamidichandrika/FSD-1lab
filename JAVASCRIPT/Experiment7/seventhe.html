<!DOCTYPE html>
<html>
<head><title>String Object Example</title></head>
<body>
  <script>
    var message = "Hello, JavaScript!";
    document.write("<b>Original string:</b> " + message + "<br>");
    document.write("<b>Length:</b> " + message.length + "<br>");
    document.write("<b>Uppercase:</b> " + message.toUpperCase() + "<br>");
    document.write("<b>Lowercase:</b> " + message.toLowerCase() + "<br>");
    document.write("<b>Index of 'JavaScript':</b> " + message.indexOf("JavaScript") + "<br>");
    document.write("<b>Substring (7,17):</b> " + message.substring(7,17) + "<br>");
    document.write("<b>Replace 'JavaScript' with 'World':</b> " + message.replace("JavaScript", "World") + "<br>");
  </script>
</body>
</html>

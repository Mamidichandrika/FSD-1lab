<!DOCTYPE html>
<html>
<head>
  <title>Number Operations</title>
  <script>
    function factorial(n) {
      if(n < 0) return "Invalid";
      if (n === 0 || n === 1) return 1;
      let fact = 1;
      for(let i = 2; i <= n; i++) fact *= i;
      return fact;
    }

    function fibonacci(n) {
      let fib = [0, 1];
      for(let i = 2; i <= n; i++) fib[i] = fib[i - 1] + fib[i - 2];
      return fib.slice(0, n+1).join(', ');
    }

    function primes(n) {
      let primeList = [];
      for(let i = 2; i <= n; i++) {
        let isPrime = true;
        for(let j = 2; j <= Math.sqrt(i); j++) {
          if(i % j === 0) {
            isPrime = false;
            break;
          }
        }
        if(isPrime) primeList.push(i);
      }
      return primeList.join(', ');
    }

    function isPalindrome(str) {
      let s = str.toString();
      return s === s.split('').reverse().join('');
    }

    function displayResult(operation) {
      let n = parseInt(document.getElementById('number').value);
      let result;
      if(isNaN(n) || n < 0) {
        alert("Please enter a valid non-negative number");
        return;
      }

      switch(operation) {
        case 'factorial':
          result = factorial(n);
          break;
        case 'fibonacci':
          result = fibonacci(n);
          break;
        case 'prime':
          result = primes(n);
          break;
        case 'palindrome':
          result = isPalindrome(n) ? "Is a palindrome" : "Not a palindrome";
          break;
      }
      document.getElementById('output').innerText = result;
    }
  </script>
</head>
<body>
  Enter a number: <input type="text" id="number"><br><br>
  <button onclick="displayResult('factorial')">Factorial</button>
  <button onclick="displayResult('fibonacci')">Fibonacci</button>
  <button onclick="displayResult('prime')">Prime</button>
  <button onclick="displayResult('palindrome')">Palindrome</button>

  <h3>Output:</h3>
  <div id="output" style="font-weight:bold;"></div>
</body>
</html>

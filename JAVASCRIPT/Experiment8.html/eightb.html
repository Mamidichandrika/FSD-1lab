<!DOCTYPE html>
<html>
<head><title>Week Days Switch</title></head>
<body>
  <script>
    let day = parseInt(prompt("Enter week day number (1-7):"));
    let weekDay;
    switch(day) {
      case 1: weekDay = "Sunday"; break;
      case 2: weekDay = "Monday"; break;
      case 3: weekDay = "Tuesday"; break;
      case 4: weekDay = "Wednesday"; break;
      case 5: weekDay = "Thursday"; break;
      case 6: weekDay = "Friday"; break;
      case 7: weekDay = "Saturday"; break;
      default: weekDay = "Invalid entry";
    }
    document.write("<b>Day: " + weekDay + "</b>");
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working of Hyperlinks</title>
</head>
<body>
    <h1>Working of Hyperlinks Using &lt;a&gt; Tag</h1>
    <p>This program demonstrates how to create hyperlinks using the &lt;a&gt; tag with <code>href</code> and <code>target</code> attributes.</p>

    <!-- Link opening in the same tab (default) -->
    <a href="https://www.example.com" target="_self">Go to Example.com (Same Tab)</a>
    <br><br>

    <!-- Link opening in a new tab -->
    <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Go to Google (New Tab)</a>
    <br><br>

    <!-- Link opening in the parent frame -->
    <a href="https://www.wikipedia.org" target="_parent">Go to Wikipedia (Parent Frame)</a>
    <br><br>

    <!-- Link opening in the topmost frame -->
    <a href="https://www.github.com" target="_top">Go to GitHub (Top Frame)</a>
    <br><br>

    <!-- Link without target attribute opens in the same tab -->
    <a href="https://www.mozilla.org">Go to Mozilla (Default)</a>
</body>
</html>

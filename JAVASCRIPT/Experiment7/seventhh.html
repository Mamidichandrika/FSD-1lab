<!DOCTYPE html>
<html>
<head><title>User Object Example</title></head>
<body>
  <script>
    function Person(name, age) { // Constructor
      this.name = name;         // Property
      this._age = age;          // Private Property by convention
    
      // Method
      this.greet = function() {
        return "Hello, my name is " + this.name;
      };
    
      // Accessors
      Object.defineProperty(this, 'age', {
        get: function() {
          return this._age;
        },
        set: function(value) {
          if(value > 0) this._age = value;
        }
      });
    }
    
    var user1 = new Person("Alex", 21); // Using constructor
    document.write("<b>Name:</b> " + user1.name + "<br>");           // Property
    document.write("<b>Age:</b> " + user1.age + "<br>");            // Accessor (getter)
    document.write("<b>Greeting:</b> " + user1.greet() + "<br>");   // Method
    user1.age = 22; // Accessor (setter)
    document.write("<b>Updated Age:</b> " + user1.age + "<br>");
  </script>
</body>
</html>
